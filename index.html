async function boot(u){clr();S.uid=u.uid;const d=await getDoc(doc(db,'users',u.uid));S.u=d.exists()?d.data():null;
 if(!S.u){toast('Profile not found');R();return}

 else if(S.u.role==='admin'){S.tab='aa';const er=()=>{};subs.push(onSnapshot(collection(db,'users'),s=>{S.au=ls(s);R()},er));subs.push(onSnapshot(collection(db,'stores'),s=>{S.as=ls(s);R()},er));subs.push(onSnapshot(collection(db,'orders'),s=>{S.ao=ls(s);R()},er))}
 else if(S.u.role==='rider'){S.tab='rh';if(S.u.approved){const er=()=>{};let ri=0;subs.push(onSnapshot(query(collection(db,'orders'),where('status','==','Ready for pickup')),s=>{if(ri&&S.u.online)s.docChanges().forEach(c=>{if(c.type==='added'&&!c.doc.data().riderId)alertNow('New delivery request!')});ri=1;S.req=ls(s);R()},er));subs.push(onSnapshot(query(collection(db,'orders'),where('riderId','==',S.uid)),s=>{S.mine=ls(s);R()},er))}}
 else{S.tab='st';subs.push(onSnapshot(query(collection(db,'stores'),where('approved','==',true)),s=>{S.stores=ls(s);R()}));let ci=0;subs.push(onSnapshot(query(collection(db,'orders'),where('customerId','==',S.uid)),s=>{if(ci)s.docChanges().forEach(c=>{if(c.type==='modified'){const st=c.doc.data().status;alertNow('Order update: '+(LB[st]||st),1)}});ci=1;S.orders=ls(s);R()}))}
 R()}
onAuthStateChanged(auth,async u=>{if(S.signing)return;if(!u){clr();S.uid=null;S.u=null;R();return}await boot(u)});
window.F={

  if(S.mode==='in')await signInWithEmailAndPassword(auth,e,p);
  else{const n=$('nm').value.trim(),ph=$('pn').value.trim(),r=$('rl').value;if(!n||!ph){toast('Enter name and phone');return}
   S.signing=1;const c=await createUserWithEmailAndPassword(auth,e,p);
   await setDoc(doc(db,'users',c.user.uid),{name:n,phone:ph,email:e,role:r,approved:r==='customer',createdAt:serverTimestamp()});S.signing=0;await boot(c.user)}
 }catch(x){S.signing=0;toast(x.code?x.code.replace('auth/','').replace(/-/g,' '):'Something went wrong')}},
 async out(){clr();S.cart={sid:null,l:{}};S.sid=null;await signOut(auth)},
